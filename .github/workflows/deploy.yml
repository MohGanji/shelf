# Goes in the shelf repo at .github/workflows/deploy.yml
# Replaces the current self-hosted-runner workflow.

name: Deploy
run-name: ${{ github.actor }} is deploying ganji.blog 🚀

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-shelf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          # Ignored — the key is pinned to `deploy-static.sh shelf` in authorized_keys.
          script: deploy-shelf
